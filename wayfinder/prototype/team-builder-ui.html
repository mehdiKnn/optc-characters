<!doctype html>
<!-- PROTOTYPE JETABLE — wayfinder ticket 008. Trois variantes de l'écran team builder PVE,
     commutables via ?variant= (A|B|C) ou les flèches ← →. Données réelles de la box (index.json).
     Coûts fictifs (absents d'index.json). Aucune persistance. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype — Team builder PVE</title>
<style>
  :root{
    --bg:#12141a; --panel:#1c1f28; --panel2:#232735; --line:#333849; --txt:#e8eaf0; --dim:#8b93a7;
    --accent:#4da3ff; --ok:#3ecf8e; --warn:#ffb454; --bad:#ff6470;
    --str:#e2574f; --dex:#3ecf8e; --qck:#4da3ff; --psy:#f2d24b; --int:#b07ce8;
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,sans-serif}
  h1,h2,h3{margin:0} button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  img{display:block}
  .thumb{width:56px;height:56px;border-radius:8px;background:#2a2e3d;object-fit:cover}
  .thumb.lg{width:72px;height:72px}
  .thumb.sm{width:34px;height:34px;border-radius:6px}
  .type{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;font-weight:700;color:#12141a}
  .type.STR{background:var(--str)} .type.DEX{background:var(--dex)} .type.QCK{background:var(--qck)}
  .type.PSY{background:var(--psy)} .type.INT{background:var(--int)}

  /* --- header (partagé) --- */
  .hdr{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .hdr .name{font-size:16px;font-weight:700}
  .badge{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .badge.pve{color:var(--accent);border-color:var(--accent)}
  .cost{margin-left:auto;font-size:13px;color:var(--dim)}
  .cost b{color:var(--txt)} .cost.over b{color:var(--bad)}

  /* --- slots --- */
  .slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border:1px dashed var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;min-width:76px}
  .slot.filled{border-style:solid}
  .slot.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(77,163,255,.35)}
  .slot .role{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .slot .nm{font-size:10px;color:var(--dim);max-width:80px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot .clr{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;display:none}
  .slot.filled:hover .clr{display:block}
  .sup{position:absolute;bottom:16px;right:-8px;width:26px;height:26px;border-radius:50%;border:1px dashed var(--line);background:var(--panel);font-size:10px;color:var(--dim);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sup.active{border-color:var(--accent)} .sup img{width:100%;height:100%;object-fit:cover}

  /* --- conditions --- */
  .cond{display:flex;gap:8px;padding:8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);align-items:flex-start}
  .cond input{margin-top:2px;accent-color:var(--accent)}
  .cond.done{border-color:var(--ok)} .cond.raw{opacity:.55}
  .cond .src{font-size:10px;color:var(--dim)}
  .cond .txt{font-size:12px}
  .cond .meter{font-size:12px;font-weight:700;white-space:nowrap;margin-left:auto}
  .cond .meter.ok{color:var(--ok)} .cond .meter.neg{color:var(--warn)}
  .cond>div{min-width:0}
  .chk{display:flex;gap:4px;margin-top:2px;margin-left:auto;flex-shrink:0}
  .chk .type{opacity:.25} .chk .type.on{opacity:1}
  .capbadge{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--warn);color:var(--warn)}
  .capbadge.on{border-color:var(--ok);color:var(--ok)}

  /* --- candidats --- */
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0}
  .filters input,.filters select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 8px;font:inherit}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
  .cand{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
  .cand:hover{border-color:var(--accent)}
  .cand .nm{font-size:10px;color:var(--dim);width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cand .score{position:absolute;top:2px;right:2px;background:var(--accent);color:#0b1220;font-size:10px;font-weight:800;border-radius:4px;padding:0 4px}
  .hint{color:var(--dim);font-size:12px;padding:8px 0}

  .paneltitle{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:8px}
  .stack{display:flex;flex-direction:column;gap:8px}

  /* --- switcher (hors design) --- */
  .switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#000;color:#fff;border:1px solid #555;border-radius:99px;padding:6px 14px;font-size:13px;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.6)}
  .switcher button{font-size:16px;padding:0 4px}

  /* ===== Variante A : trois colonnes ===== */
  .vA{display:grid;grid-template-columns:230px 1fr 340px;gap:0;height:calc(100vh - 49px)}
  .vA>div{overflow-y:auto;padding:12px}
  .vA .colTeam{background:var(--panel);border-right:1px solid var(--line)}
  .vA .colTeam .slot{flex-direction:row;justify-content:flex-start;gap:10px;width:100%;margin-bottom:8px}
  .vA .colTeam .slot .nm{max-width:110px;font-size:11px;text-align:left}
  .vA .colConds{background:var(--panel);border-left:1px solid var(--line)}

  /* ===== Variante B : plateau ===== */
  .vB .board{display:flex;gap:12px;justify-content:center;padding:14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .vB .condstrip{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .vB .condstrip .cond{min-width:260px;max-width:300px;flex-direction:column}
  .vB .condstrip .cond .meter{margin-left:0}
  .vB .main{padding:12px 14px}

  /* ===== Variante C : conditions d'abord ===== */
  .vC{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 49px - 96px)}
  .vC>div{overflow-y:auto;padding:12px}
  .vC .colConds{background:var(--panel);border-right:1px solid var(--line)}
  .vC .colConds .cond{padding:12px}
  .vC .dock{position:fixed;left:0;right:0;bottom:0;height:96px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:center;padding:0 12px}
  .vC .dock .slot{min-width:56px;padding:4px}
  .vC .dock .slot .role{font-size:8px} .vC .dock .slot .nm{display:none}
  .vC .dock .thumb{width:44px;height:44px}
</style>
</head>
<body>
<div id="app"></div>
<div class="switcher">
  <button id="prev">‹</button><span id="vlabel"></span><button id="next">›</button>
</div>

86,"name":"Usopp - Warrior's Outfit","types":["INT"],"classes":["Striker","Shooter"],"tags":["Straw Hat Pirates","Elbaph Arc"]},{"id":4587,"name":"Tony Tony Chopper - Rescued Ship Doctor","types":["INT"],"classes":["Striker","Cerebral"],"tags":["Straw Hat Pirates","Zoan-type / Devil Fruit User","Elbaph Arc"]},{"id":4595,"name":"Nico Olvia - Entrusting to her Daughter","types":["STR"],"classes":["Striker","Cerebral"],"tags":["Ohara","Elbaph Arc"]},{"id":4599,"name":"Jesus Burgess - Monstrous Might Chasing After the Sulong","types":["QCK"],"classes":["Free Spirit","Fighter"],"tags":["Blackbeard Pirates","Paramythia-type / Devil Fruit User","Egghead Arc"]},{"id":4600,"name":"Shiryu - A Hidden Blade That Exploits the Opening","types":["QCK"],"classes":["Free Spirit","Slasher"],"tags":["Blackbeard Pirates","Paramythia-type / Devil Fruit User","Egghead Arc"]},{"id":4612,"name":"Saintess Gunko - Confirmed Path of the Future","types":["STR"],"classes":["Powerhouse","Cerebral"],"tags":["Holy Knights","World Government","Celestial Dragon","Paramythia-type / Devil Fruit User","Elbaph Arc"]},{"id":4614,"name":"Brook - Musician in Warrior's Outfit","types":["DEX"],"classes":["Slasher","Striker"],"tags":["Straw Hat Pirates","Paramythia-type / Devil Fruit User","Elbaph Arc"]},{"id":4618,"name":"Collun","types":["DEX"],"classes":["Striker","Powerhouse"],"tags":["Giant","Child","Elbaph Arc"]},{"id":4630,"name":"Scopper Gaban - The Left Arm of the Pirate King","types":["DEX"],"classes":["Striker","Slasher"],"tags":["Former / Roger Pirates","Elbaph Arc"]},{"id":4631,"name":"Luffy & Zoro - Captain and His Right-Hand Man Seeking the Key","types":["INT","DEX"],"classes":["Striker","Slasher"],"tags":["Straw Hat Pirates","Four Emperors","Worst Generation","Mythical Zoan-type / Devil Fruit User","Elbaph Arc"]},{"id":4633,"name":"Nami - Exasperated Navigator","types":["DEX"],"classes":["Striker","Free Spirit"],"tags":["Straw Hat Pirates","Elbaph Arc"]}];
const byId = Object.fromEntries(BOX.map(u=>[u.id,u]));
const pad4 = id => String(id).padStart(4,'0');
const thumb = id => `https://2shankz.github.io/optc-db.github.io/api/images/thumbnail/glo/${Math.floor(id/1000)}/${Math.floor((id%1000)/100)}00/${pad4(id)}.png`;
const cost = id => 40 + (id % 30); // coût fictif, absent d'index.json
const TYPES = ['STR','DEX','QCK','PSY','INT'];
const CLASSES = ['Fighter','Slasher','Striker','Shooter','Free Spirit','Cerebral','Powerhouse','Driven'];
const SHIPS = ['Thousand Sunny','Going Merry','Moby Dick','Oro Jackson'];
const hasTag = (u,list) => u.tags.some(t=>list.some(l=>t.includes(l)));
const inFam = (u,names) => names.some(n=>u.name.includes(n));

/* Conditions curées (phrasés réels de la base), rattachées à des unités de la box.
   Couvre : seuil, seuil OR-é, arc-en-ciel, roster, scaler, membre nommé, « or fewer »,
   compte exact, badge must-be-captain, résidu non cochable. */
const ROSTER_SH = ['Monkey D. Luffy','Roronoa Zoro','Nami','Usopp','Sanji','Tony Tony Chopper','Nico Robin','Franky','Brook','Jinbe'];
const CONDS = [
 {id:'c1', holder:2938, src:'Captain Ability', kind:'threshold', n:3,
  text:"If your crew has 3 or more Slasher characters, deals 10% of enemies' current HP in damage to all enemies at the end of each turn",
  label:'Slasher', match:u=>u.classes.includes('Slasher')},
 {id:'c4', holder:4631, src:'Captain Ability', kind:'roster', n:6,
  text:'Crew must consist of any 6 of: '+ROSTER_SH.join(', '),
  label:'Roster', match:u=>inFam(u,['Luffy','Zoro','Nami','Usopp','Sanji','Chopper','Robin','Franky','Brook','Jinbe'])},
 {id:'c2', holder:4380, src:'Super Special (EX)', kind:'threshold', n:5, captainOnly:true,
  text:"If your crew has 5+ [Five Elders], [Celestial Dragon] or [Navy] characters, increases enemies' Damage Limiter limit up to 1",
  label:'[Five Elders] ∪ [Celestial Dragon] ∪ [Navy]', match:u=>hasTag(u,['Five Elders','Celestial Dragon','Navy'])},
 {id:'c3', holder:4380, src:'Super Special (EX)', kind:'rainbow', captainOnly:true,
  text:'…and there is a [STR], [DEX], [QCK], [PSY] and [INT] character in your crew'},
 {id:'c5', holder:3508, src:'Sailor', kind:'scaler',
  text:'Boosts ATK of Powerhouse characters depending on the number of Powerhouse characters in your crew',
  label:'Powerhouse', match:u=>u.classes.includes('Powerhouse')},
 {id:'c6', holder:2887, src:'Captain Ability', kind:'orFewer', n:2,
  text:'If your crew has 2 or fewer Free Spirit characters, boosts ATK of all characters by 2.5x',
  label:'Free Spirit', match:u=>u.classes.includes('Free Spirit')},
 {id:'c7', holder:2944, src:'Special', kind:'member', names:['Roronoa Zoro','Zorojuro'],
  text:'If your crew has Roronoa Zoro as a member or supporting this character, increases boost effects of ATK Up buffs by +0.3x'},
 {id:'c8', holder:3245, src:'Captain Ability', kind:'exact', n:6,
  text:'If your crew has 6 [INT] characters, boosts base ATK of top row characters by 100',
  label:'[INT]', match:u=>u.types.includes('INT')},
 {id:'c9', holder:2936, src:'Special', kind:'raw',
  text:'If your crew has Color Affinity when the special is activated, increases boost effects of Color Affinity buffs by +0.3x'},
];

/* --- état (en mémoire, pré-rempli pour que l'écran vive) --- */
const S = {
  name:'Équipe anti-Saturn', capMax:280,
  captain:4631, friend:4380, members:[2938,null,null,null],
  supports:{captain:null, m0:null, m1:null, m2:null, m3:null},
  shipIdx:0, checked:new Set(['c1','c4']), activeSlot:null,
  q:'', fType:'', fClass:'',
};

const crew = () => [S.captain,S.friend,...S.members].filter(Boolean).map(id=>byId[id]);
const crewCost = () => [S.captain,...S.members,...Object.values(S.supports)].filter(Boolean).reduce((a,id)=>a+cost(id),0);

/* --- moteur minimal --- */
function condState(c){
  const cs = crew();
  const st = {c, checked:S.checked.has(c.id), raw:c.kind==='raw'};
  if(c.kind==='raw') return st;
  if(c.captainOnly!==undefined) st.isCaptain = [S.captain,S.friend].includes(c.holder);
  if(c.kind==='rainbow'){
    st.have = TYPES.filter(t=>cs.some(u=>u.types.includes(t)));
    st.done = st.have.length===5;
  } else if(c.kind==='member'){
    st.done = cs.some(u=>inFam(u,c.names)) || Object.values(S.supports).some(id=>id&&inFam(byId[id],c.names));
    st.count = st.done?1:0; st.n=1;
  } else {
    st.count = cs.filter(c.match).length; st.n = c.n;
    if(c.kind==='threshold'||c.kind==='roster') st.done = st.count>=c.n;
    if(c.kind==='exact'){ st.done = st.count===c.n; st.negNow = st.count>=c.n; }
    if(c.kind==='orFewer'){ st.neg=true; st.done = st.count<=c.n; }
    if(c.kind==='scaler'){ st.done=false; }
  }
  st.activePos = st.checked && !st.neg && !st.negNow && !st.done && c.kind!=='raw';
  if(c.kind==='scaler' && st.checked) st.activePos = true;
  st.activeNeg = st.checked && (st.neg || st.negNow);
  return st;
}
function helps(st,u){
  const c=st.c;
  if(c.kind==='rainbow') return u.types.some(t=>!st.have.includes(t));
  if(c.kind==='member') return inFam(u,c.names);
  return c.match(u);
}
function violates(st,u){
  const c=st.c;
  if(c.kind==='orFewer') return c.match(u) && st.count>=c.n;
  if(c.kind==='exact' && st.negNow) return c.match(u);
  return false;
}
function candidates(){
  const inTeam = new Set([S.captain,S.friend,...S.members,...Object.values(S.supports)].filter(Boolean));
  const states = visibleConds().map(condState).filter(s=>!s.raw);
  const pos = states.filter(s=>s.activePos), neg = states.filter(s=>s.activeNeg);
  let list = BOX.filter(u=>!inTeam.has(u.id));
  if(S.q) list = list.filter(u=>u.name.toLowerCase().includes(S.q.toLowerCase())||String(u.id).includes(S.q));
  if(S.fType) list = list.filter(u=>u.types.includes(S.fType));
  if(S.fClass) list = list.filter(u=>u.classes.includes(S.fClass));
  list = list.filter(u=>!neg.some(s=>violates(s,u)));
  let scored = list.map(u=>({u, score: pos.filter(s=>helps(s,u)).length}));
  if(pos.length) scored = scored.filter(x=>x.score>0);
  scored.sort((a,b)=>b.score-a.score || b.u.id-a.u.id);
  return {scored, smart:pos.length>0};
}
const visibleConds = () => CONDS.filter(c=>[S.captain,S.friend,...S.members].includes(c.holder));

/* --- actions --- */
function clickSlot(key){ S.activeSlot = S.activeSlot===key?null:key; render(); }
function clearSlot(key,ev){ ev.stopPropagation();
  if(key==='captain')S.captain=null; else if(key==='friend')S.friend=null;
  else if(key.startsWith('m'))S.members[+key[1]]=null; else S.supports[key.slice(4)]=null;
  render();
}
function pick(id){
  let k = S.activeSlot;
  if(!k){ const i=S.members.indexOf(null); k = i>=0?'m'+i : null; }
  if(!k) return;
  if(k.startsWith('sup:')) S.supports[k.slice(4)]=id;
  else if(k==='captain')S.captain=id; else if(k==='friend')S.friend=id; else S.members[+k[1]]=id;
  S.activeSlot=null; render();
}
function toggle(cid){ S.checked.has(cid)?S.checked.delete(cid):S.checked.add(cid); render(); }
function cycleShip(){ S.shipIdx=(S.shipIdx+1)%SHIPS.length; render(); }

/* --- briques de rendu --- */
const esc = s => s.replace(/"/g,'&quot;');
function imgTag(id,cls){ return `<img class="thumb ${cls||''}" loading="lazy" src="${thumb(id)}" onerror="this.style.visibility='hidden'">`; }
function slotTile(key,role,id,{support=true,cls=''}={}){
  const u = id?byId[id]:null;
  const supKey='sup:'+key, supId=S.supports[key.replace('m','m')]!==undefined?S.supports[key]:undefined;
  const supHtml = support&&(key==='captain'||key.startsWith('m'))
    ? `<button class="sup ${S.activeSlot===supKey?'active':''}" title="Support" onclick="event.stopPropagation();clickSlot('${supKey}')">${S.supports[key]?imgTag(S.supports[key],'sm'):'+'}</button>`:'';
  return `<div class="slot ${u?'filled':''} ${S.activeSlot===key?'active':''} ${cls}" onclick="clickSlot('${key}')">
    <span class="role">${role}</span>
    ${u?imgTag(u.id):'<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:var(--dim)">+</div>'}
    <span class="nm">${u?esc(u.name):'vide'}</span>
    ${u?`<button class="clr" onclick="clearSlot('${key}',event)">×</button>`:''}
    ${supHtml}</div>`;
}
function shipTile(){
  return `<div class="slot filled" onclick="cycleShip()" title="Cliquer pour changer (maquette)">
    <span class="role">Ship</span><div class="thumb" style="display:flex;align-items:center;justify-content:center">⛵</div>
    <span class="nm">${SHIPS[S.shipIdx]}</span></div>`;
}
function condRow(c){
  const st = condState(c);
  const holder = byId[c.holder];
  let meter='';
  if(st.raw) meter='<span class="src">non traçable</span>';
  else if(c.kind==='rainbow') meter='';
  else if(c.kind==='scaler') meter=`<span class="meter">${st.count} ×</span>`;
  else meter=`<span class="meter ${st.done?'ok':''} ${st.neg||st.negNow?'neg':''}">${st.count}/${st.n}${st.done?' ✓':''}</span>`;
  const cap = c.captainOnly!==undefined?`<span class="capbadge ${st.isCaptain?'on':''}">must be captain ${st.isCaptain?'✓':'✗'}</span>`:'';
  return `<div class="cond ${st.done?'done':''} ${st.raw?'raw':''}">
    ${st.raw?'':`<input type="checkbox" ${st.checked?'checked':''} onchange="toggle('${c.id}')" title="${st.neg?'Cochée : exclut les violeurs':'Cochée : promeut les candidats'}">`}
    <div style="flex:1">
      <div class="src">${esc(holder.name)} — ${c.src}${c.label?` · ${c.label}`:''} ${cap}</div>
      <div class="txt">${esc(c.text)}</div>
      ${c.kind==='rainbow'?`<span class="chk">${TYPES.map(t=>`<span class="type ${t} ${st.have.includes(t)?'on':''}">${t}</span>`).join('')}</span>`:''}
    </div>${meter}</div>`;
}
function candGrid(){
  const {scored,smart} = candidates();
  return `<div class="filters">
      <input placeholder="Rechercher (nom ou ID)…" value="${esc(S.q)}" oninput="S.q=this.value;render()" style="flex:1;min-width:160px">
      <select onchange="S.fType=this.value;render()"><option value="">Type</option>${TYPES.map(t=>`<option ${S.fType===t?'selected':''}>${t}</option>`).join('')}</select>
      <select onchange="S.fClass=this.value;render()"><option value="">Classe</option>${CLASSES.map(t=>`<option ${S.fClass===t?'selected':''}>${t}</option>`).join('')}</select>
    </div>
    <div class="hint">${smart?`Recherche intelligente : ${scored.length} candidats font progresser les conditions cochées, triés par score.`:`${scored.length} personnages de la box (aucune condition active — navigateur normal).`}
    ${S.activeSlot?` · Cible : <b style="color:var(--accent)">${S.activeSlot}</b>`:' · Cliquer un candidat remplit le premier slot membre vide.'}</div>
    <div class="grid">${scored.map(({u,score})=>`
      <div class="cand" onclick="pick(${u.id})">
        ${score?`<span class="score">+${score}</span>`:''}
        ${imgTag(u.id)}
        <div>${u.types.map(t=>`<span class="type ${t}">${t}</span>`).join(' ')}</div>
        <span class="nm" title="${esc(u.name)}">${esc(u.name)}</span>
      </div>`).join('')}</div>`;
}
function header(){
  const c=crewCost(), over=c>S.capMax;
  return `<div class="hdr"><span class="name">${S.name}</span><span class="badge pve">PVE</span>
    <span class="cost ${over?'over':''}">Coût <b>${c}</b> / ${S.capMax} <span style="opacity:.5">(fictif)</span></span></div>`;
}

/* ===== Variantes ===== */
function VariantA(){
  return header()+`<div class="vA">
    <div class="colTeam"><div class="paneltitle">Équipe</div>
      ${slotTile('captain','Captain',S.captain)}${slotTile('friend','Friend captain',S.friend,{support:false})}
      ${S.members.map((id,i)=>slotTile('m'+i,'Membre '+(i+1),id)).join('')}${shipTile()}</div>
    <div><div class="paneltitle">Candidats — ma box</div>${candGrid()}</div>
    <div class="colConds"><div class="paneltitle">Conditions de composition</div><div class="stack">${visibleConds().map(condRow).join('')||'<span class="hint">Ajoutez des personnages : leurs conditions apparaissent ici.</span>'}</div></div>
  </div>`;
}
function VariantB(){
  return header()+`<div class="vB">
    <div class="board">
      ${slotTile('captain','Captain',S.captain)}
      ${S.members.map((id,i)=>slotTile('m'+i,'M'+(i+1),id)).join('')}
      ${slotTile('friend','Friend',S.friend,{support:false})}
      ${shipTile()}</div>
    <div class="condstrip">${visibleConds().map(condRow).join('')||'<span class="hint">Aucune condition — équipe vide.</span>'}</div>
    <div class="main"><div class="paneltitle">Candidats — ma box</div>${candGrid()}</div>
  </div>`;
}
function VariantC(){
  return header()+`<div class="vC">
    <div class="colConds"><div class="paneltitle">Conditions — le plan de l'équipe</div><div class="stack">${visibleConds().map(condRow).join('')||'<span class="hint">Aucune condition.</span>'}</div></div>
    <div><div class="paneltitle">Candidats — ma box</div>${candGrid()}</div>
    <div class="dock">
      ${slotTile('captain','CAP',S.captain)}${slotTile('friend','FR',S.friend,{support:false})}
      ${S.members.map((id,i)=>slotTile('m'+i,'M'+(i+1),id)).join('')}${shipTile()}</div>
  </div>`;
}

/* ===== switcher ===== */
const VARIANTS = {A:['Trois colonnes',VariantA], B:['Plateau de jeu',VariantB], C:["Conditions d'abord",VariantC]};
const keys = Object.keys(VARIANTS);
let cur = new URLSearchParams(location.search).get('variant');
if(!keys.includes(cur)) cur='A';
function setVariant(k){ cur=k; history.replaceState(null,'','?variant='+k); render(); }
function cycle(d){ setVariant(keys[(keys.indexOf(cur)+d+keys.length)%keys.length]); }
document.getElementById('prev').onclick=()=>cycle(-1);
document.getElementById('next').onclick=()=>cycle(1);
addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft')cycle(-1); if(e.key==='ArrowRight')cycle(1);
});
function render(){
  document.getElementById('app').innerHTML = VARIANTS[cur][1]();
  document.getElementById('vlabel').textContent = `${cur} — ${VARIANTS[cur][0]}`;
}
render();
</script>
</body>
</html>
