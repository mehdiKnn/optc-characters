name: Update optc-db data
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:update
      - run: npm run data:build
      - run: npm test
      - run: npm run build
      - name: Commit pinned SHA when changed
        run: |
          if ! git diff --quiet -- data-source.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data-source.json
            git commit -m "chore(data): update pinned optc-db SHA"
            git push
          fi
